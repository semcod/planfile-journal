[package]
name = "planfile-journal"
version = "0.1.0"
edition = "2021"
authors = ["Tom Sapletta <tom@sapletta.com>"]
description = "Ultra-fast reverse-seek JSONL tail, cryptographic hash chain, and PLOG/1 projection for planfile"
license = "Apache-2.0"

[lib]
name = "planfile_journal_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ahash = { version = "0.8", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
